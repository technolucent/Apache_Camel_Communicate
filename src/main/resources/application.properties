server.port=8080
# Camel runs under Spring Boot; no standalone controller needed

# 1. Turn on tracing & sample 100% of requests
management.tracing.enabled=true
management.tracing.sampling.probability=1.0

# 2. Tell OTel where Jaeger lives via the OTLP exporter
management.otlp.tracing.endpoint=http://jaeger:4318/v1/traces
management.otlp.tracing.export.enabled=true

# 3. Add TraceID to your console logs
logging.pattern.level=%5p [${spring.application.name:oss},%X{traceId:-},%X{spanId:-}]

# Expose basic actuator endpoints for health/debugging
management.endpoints.web.exposure.include=health,info,metrics
# Health details only to authorized users (liveness/readiness still public via SecurityConfig)
management.endpoint.health.show-details=when-authorized
