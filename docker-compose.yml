services:
  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:?set RABBITMQ_USER in .env}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASS:?set RABBITMQ_PASS in .env}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 12

  jaeger:
    image: jaegertracing/all-in-one:1.59
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - COLLECTOR_OTLP_HTTP_HOST_PORT=:4318
      - COLLECTOR_OTLP_GRPC_HOST_PORT=:4317
    ports:
      - "16686:16686" # Jaeger Web UI
      - "4318:4318"   # OTLP HTTP receiver (what Spring Boot talks to)
  camel-app:
    build: .
    depends_on:
      rabbitmq:
        condition: service_healthy
      jaeger:
        condition: service_started
    environment:
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_USERNAME=${RABBITMQ_USER:?set RABBITMQ_USER in .env}
      - SPRING_RABBITMQ_PASSWORD=${RABBITMQ_PASS:?set RABBITMQ_PASS in .env}
      - APP_SECURITY_USERNAME=${APP_SECURITY_USERNAME:?set APP_SECURITY_USERNAME in .env}
      - APP_SECURITY_PASSWORD=${APP_SECURITY_PASSWORD:?set APP_SECURITY_PASSWORD in .env}
      # OTel javaagent is wired in the Dockerfile ENTRYPOINT — do not add it again via JAVA_TOOL_OPTIONS
      - OTEL_SERVICE_NAME=camel-oss
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  rabbitmq-data: